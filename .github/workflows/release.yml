name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Semantic Version (e.g. 1.0.0-beta.1)'
        required: true
        default: '1.0.0-beta.1'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Determine Version Name and Code
        id: versioning
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_VERSION="${{ github.event.inputs.version_name }}"
          else
            TAG_VERSION="${GITHUB_REF_NAME#v}"
          fi
          # Automatically increment versionCode using GitHub Run Number
          V_CODE=$((GITHUB_RUN_NUMBER + 100))
          echo "VERSION_NAME=${TAG_VERSION}" >> $GITHUB_ENV
          echo "VERSION_CODE=${V_CODE}" >> $GITHUB_ENV
          echo "Building OpenRide version ${TAG_VERSION} (code: ${V_CODE})"

      - name: Decode Release Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/release.jks"
            echo "KEYSTORE_PATH=${{ runner.temp }}/release.jks" >> $GITHUB_ENV
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "No custom RELEASE_KEYSTORE_BASE64 secret found. Using default release signing."
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x open-ride-companion/gradlew

      - name: Build Release APK with Gradle
        env:
          VERSION_NAME: ${{ env.VERSION_NAME }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
          RELEASE_KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cd open-ride-companion
          ./gradlew assembleRelease --stacktrace

      - name: Locate and Rename Release APK
        run: |
          OUTPUT_DIR="open-ride-companion/app/build/outputs/apk/release"
          APK_FILE=$(find "$OUTPUT_DIR" -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Release APK not found in $OUTPUT_DIR"
            exit 1
          fi
          DEST_APK="openride-v${VERSION_NAME}.apk"
          cp "$APK_FILE" "$DEST_APK"
          echo "RELEASE_APK_PATH=${DEST_APK}" >> $GITHUB_ENV
          echo "Prepared asset: ${DEST_APK}"

      - name: Clean Up Temporary Keystore
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/release.jks" ]; then
            rm -f "${{ runner.temp }}/release.jks"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || format('v{0}', env.VERSION_NAME) }}
          name: OpenRide Companion v${{ env.VERSION_NAME }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          generate_release_notes: true
          body: |
            ## OpenRide Companion ${{ env.VERSION_NAME }}

            ### Included Features
            - **WhatsApp & Map Link Support:** Tap shared WhatsApp location messages or `maps.app.goo.gl` links to open directly in OpenRide.
            - **Android Map Handler:** Registered as a system handler for `geo:` and `google.navigation:` URIs to appear in the "Open with" chooser alongside Google Maps.
            - **Local Search Engine:** Built-in place, shop, and address search with proximity distance calculations and motorcyclist quick categories (Fuel, EV, Bike Repair/Puncture, Food, Hospitals).
            - **In-App Auto Updater:** Automatically checks GitHub Releases for newer builds and downloads/installs in-place.
            - **Galaxy S23 Ultra & Android 15/16 Ready:** Edge-to-edge layout, OLED high-contrast dark palette, and dual foreground service compliance (`location|connectedDevice`).

            ### Installation Instructions
            1. Download `openride-v${{ env.VERSION_NAME }}.apk` below.
            2. Open the file on your Android device. If prompted, allow "Install Unknown Apps" from your browser/files app.
            3. Tap **Install** (or **Update**). All settings and data are preserved.
          files: |
            ${{ env.RELEASE_APK_PATH }}
